# https://github.com/P3TERX/Actions-OpenWrt
# Description: Build OpenWrt using GitHub Actions
#
# The firmware is built from the pinned source repository below (a snapshot of
# Lean's LEDE). SOURCE_BRANCH is both the revision that gets compiled and the
# revision the update checker tracks, so "upstream updated" can never disagree
# with "what was actually built".
#
# The build job compiles with read-only repository permissions. Only the
# publish job receives contents: write, so neither the upstream source nor the
# hundreds of third-party feed Makefiles executed during the build can reach a
# token that can push to this repository.
#

name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions (debugging)'
        required: false
        default: 'false'

env:
  SOURCE_REPO_URL: https://github.com/Samre/lede
  SOURCE_REPO: Samre/lede
  SOURCE_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai
  # The Go-based feed packages (adguardhome, sing-box, ...) fail with
  # "no required module provides package ..." when a module cannot be fetched,
  # which is what this repository diagnosed as the root cause in cc997d2:
  # proxy.golang.org is unreliable from GitHub runners. It has to live here, in
  # the job environment, because a GOPROXY exported by a step script does not
  # survive into the later compile step.
  GOPROXY: https://goproxy.cn,https://proxy.golang.org,direct

concurrency:
  group: openwrt-build
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # $GITHUB_ENV does not cross job boundaries, so the pinned revision has to
    # be handed to the publish job as an output.
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        sudo apt-get -qq update
        sudo apt-get -qq install --no-install-recommends \
          build-essential asciidoc binutils bzip2 gawk gettext \
          libncurses-dev libz-dev patch python3 unzip zlib1g-dev \
          libc6-dev-i386 subversion flex uglifyjs gcc-multilib \
          p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev \
          xmlto qemu-utils upx libelf-dev autoconf automake libtool \
          autopoint device-tree-compiler ccache
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
    - name: Create working directory
      run: |
        set -euo pipefail
        sudo mkdir -p /workdir
        sudo chown $USER:$USER /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        set -euo pipefail
        df -hT $PWD
        git clone $SOURCE_REPO_URL -b $SOURCE_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Resolve and pin source revision
      id: resolve
      working-directory: /workdir/openwrt
      run: |
        set -euo pipefail
        SOURCE_SHA=$(git rev-parse HEAD)
        echo "source_sha=$SOURCE_SHA" >> $GITHUB_OUTPUT
        echo "SOURCE_SHA=$SOURCE_SHA" >> $GITHUB_ENV
        echo "Building $SOURCE_REPO@$SOURCE_SHA"

    - name: Restore package download cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        # ccache is deliberately not cached: CONFIG_CCACHE is not a Kconfig
        # symbol in this tree, so enabling it would make `make defconfig`
        # rewrite .config and trip the reconciliation check below.
        # The v2 prefix abandons any entry saved by a run that pruned files out
        # of dl/go-mod-cache.
        path: /workdir/openwrt/dl
        key: openwrt-dl-v2-${{ env.SOURCE_SHA }}-${{ hashFiles('.config', 'diy-part1.sh', 'diy-part2.sh') }}
        restore-keys: |
          openwrt-dl-v2-${{ env.SOURCE_SHA }}-
          openwrt-dl-v2-

    - name: Load custom feeds
      run: |
        set -euo pipefail
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: |
        set -euo pipefail
        cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: |
        set -euo pipefail
        cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        set -euo pipefail
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        # Local packages authored in this repository (package/<name>/) have to
        # exist in the tree before diy-part2.sh selects them: the reconciliation
        # step below fails the build for any CONFIG_PACKAGE_* whose package is
        # not in an installed feed or in package/. A plain `mv` is wrong here
        # because openwrt/ may already contain a package/ directory from the
        # feeds, so the subdirectories are merged instead.
        if [ -d package ]; then
          mkdir -p openwrt/package
          for pkg in package/*/; do
            [ -d "$pkg" ] || continue
            name=$(basename "$pkg")
            if [ -e "openwrt/package/$name" ]; then
              echo "::error::openwrt/package/$name already exists; refusing to overwrite it with the local copy"
              exit 1
            fi
            cp -a "$pkg" "openwrt/package/$name"
            echo "local package staged: $name"
          done
        fi
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      # Debug access hands out an interactive shell on a runner that holds
      # write-capable credentials later in the build, so it stays limited to
      # the repository owner.
      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113  # v3.24
      if: github.event.inputs.ssh == 'true' && github.actor == github.repository_owner
      with:
        limit-access-to-actor: true

    - name: Prepare configuration
      run: |
        set -euo pipefail
        cd openwrt
        grep '=y$' .config | cut -d= -f1 | sort -u > /tmp/config.selected
        make defconfig
        grep '=y$' .config | cut -d= -f1 | sort -u > /tmp/config.after
        # `make defconfig` silently drops symbols it cannot resolve (unknown
        # name, missing dependency, package no longer in any installed feed),
        # so a committed .config can promise plugins the firmware will not
        # contain. Fail instead of shipping a different configuration.
        comm -23 /tmp/config.selected /tmp/config.after > /tmp/config.dropped || true
        if [ -s /tmp/config.dropped ]; then
          echo "::error::make defconfig dropped the following selected symbols; update .config or the feeds:"
          cat /tmp/config.dropped
          exit 1
        fi
        echo "all $(wc -l < /tmp/config.selected) selected symbols survived defconfig"

    - name: Download package
      id: package
      run: |
        set -euo pipefail
        cd openwrt
        make download -j8 V=s
        # The template used to delete every file under 1KB in dl/ to clean up
        # truncated downloads. That is unsafe: dl/go-mod-cache holds many
        # legitimately tiny files (module .mod/.info/.ziphash metadata and
        # small .go sources) and removing them broke module resolution with
        # "no required module provides package .../internal/..." errors — the
        # same failure this repository already diagnosed in dbfa349. It is
        # dropped rather than narrowed: `make download` reports failures and
        # OpenWrt verifies PKG_HASH, so a bad download is already caught.

    - name: Compile the firmware
      id: compile
      run: |
        set -euo pipefail
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        ls bin/targets/*/*/*.img.gz > /dev/null \
          || { echo "::error::compilation reported success but no image was produced"; exit 1; }
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "SOURCE_SHA=$SOURCE_SHA" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: |
        set -euo pipefail
        df -hT

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        set -euo pipefail
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 14

  publish:
    needs: build
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Download firmware
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: OpenWrt_firmware*
        path: firmware
        # Flatten the artifact directory so the release step and the notes
        # below can use one unambiguous glob.
        merge-multiple: true

    - name: Verify downloaded firmware
      run: |
        set -euo pipefail
        ls -l firmware
        ls firmware/*.img.gz > /dev/null \
          || { echo "::error::the downloaded artifact contains no firmware image"; exit 1; }
        echo "firmware files: $(ls firmware | wc -l)"

    - name: Mark source revision as built
      id: mark
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      run: |
        set -euo pipefail

        [ -n "${SOURCE_SHA:-}" ] \
          || { echo "::error::SOURCE_SHA was not passed from the build job"; exit 1; }
        echo "compiled revision: $SOURCE_SHA"

        # The revision that was compiled may be older than the one the checker
        # dispatched for, so compare against it. When these differ, the newer
        # commits were never built and the tag stays where it is, which makes
        # the next check schedule another build.
        LATEST_SHA=$(gh api "repos/$SOURCE_REPO/commits/$SOURCE_BRANCH" \
          --jq '.sha')

        if [ "$LATEST_SHA" != "$SOURCE_SHA" ]; then
          echo "::warning::$SOURCE_BRANCH advanced to $LATEST_SHA while $SOURCE_SHA was building; keeping the tracker at the built revision so the new commits are picked up by the next check"
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f -a upstream-tracker -m "$SOURCE_SHA"
        git push -f origin upstream-tracker

    - name: Generate release tag
      id: tag
      env:
        SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      run: |
        set -euo pipefail
        [ -n "${SOURCE_SHA:-}" ] \
          || { echo "::error::SOURCE_SHA was not passed from the build job"; exit 1; }
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        {
          echo "Automated build of \`$SOURCE_REPO@$SOURCE_SHA\` (branch \`$SOURCE_BRANCH\`)."
          echo ""
          echo "| item | value |"
          echo "|---|---|"
          echo "| source | $SOURCE_REPO@$SOURCE_SHA |"
          echo "| kernel | $(sed -n 's/^kernel - \([^ ]*\)$/\1/p' firmware/*.manifest 2>/dev/null | head -n1) |"
          echo "| packages | $(cat firmware/*.manifest 2>/dev/null | wc -l | tr -d ' ') |"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      id: release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: firmware/*

    - name: Remove old Releases
      # Replaces dev-drprasad/delete-older-releases, which only ships a Node 20
      # build and has not been updated since. Keeps the newest 3 releases and
      # leaves their git tags in place, as the action did.
      if: steps.release.outcome == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
          --jq 'sort_by(.created_at) | reverse | .[3:] | .[].tag_name' > /tmp/old-releases
        while read -r tag; do
          [ -n "$tag" ] || continue
          echo "deleting release $tag"
          gh release delete "$tag" --yes
        done < /tmp/old-releases

    - name: Delete old workflow runs
      # Replaces GitRML/delete-workflow-runs, which only ships a Node 20 build.
      # Keeps the newest 3 runs and anything younger than a day, matching the
      # retain_days: 1 / keep_minimum_runs: 3 settings it used.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
          --jq '[.workflow_runs[] | select(.status == "completed")] | sort_by(.created_at) | reverse | .[3:] | .[] | select((now - (.created_at | fromdateiso8601)) > 86400) | .id' > /tmp/old-runs
        while read -r id; do
          [ -n "$id" ] || continue
          echo "deleting run $id"
          gh run delete "$id"
        done < /tmp/old-runs
