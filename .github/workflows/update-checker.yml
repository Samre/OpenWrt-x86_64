# File: .github/workflows/update-checker.yml
# Description: Checks the build source for new commits and triggers a build
#
# The tracked repository is exactly the one build-openwrt.yml compiles
# (Samre/lede). Tracking a different repository would let the tracker claim
# "up to date" while an arbitrarily old revision gets built.
#

name: Update Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 0'  # Weekly, Sunday 19:00 UTC (Monday 03:00 Beijing)

env:
  SOURCE_REPO: Samre/lede
  SOURCE_BRANCH: master

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Check for source updates
      id: check
      run: |
        set -euo pipefail

        LATEST_SHA=$(gh api "repos/$SOURCE_REPO/commits/$SOURCE_BRANCH" \
          --jq '.sha')
        echo "latest_sha=$LATEST_SHA" >> $GITHUB_OUTPUT

        TRACKING_TAG="upstream-tracker"
        LAST_KNOWN=$(git tag -l "$TRACKING_TAG" --format='%(subject)' || true)

        if [ -n "$LAST_KNOWN" ] && [ "$LAST_KNOWN" = "$LATEST_SHA" ]; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No new commits since last successful build."
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "New commits detected or previous build failed. Triggering build."
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check for running build
      id: running
      if: steps.check.outputs.changed == 'true'
      run: |
        set -euo pipefail

        RUNNING=$(gh run list --workflow build-openwrt.yml --status in_progress \
          --status queued --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)

        if [ -n "$RUNNING" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "A build is already running ($RUNNING); skipping this dispatch."
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Trigger build workflow
      if: steps.check.outputs.changed == 'true' && steps.running.outputs.skip == 'false'
      uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4.0.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        event-type: update-detected
        client-payload: '{"sha": "${{ steps.check.outputs.latest_sha }}"}'
