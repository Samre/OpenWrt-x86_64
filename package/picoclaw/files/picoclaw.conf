# PicoClaw UCI configuration (non-secret settings only).
#
# Deliberate split between UCI and /etc/picoclaw/config.json:
#
#   UCI  (this file)                -> process/environment knobs
#   /etc/picoclaw/config.json       -> API keys, bot tokens, model list
#
# Secrets stay out of UCI on purpose: anything exported here ends up in the
# process environment, which is world-readable through /proc/<pid>/environ on
# an unpatched OpenWrt kernel. config.json is mode 0600 instead.

config basic 'config'
	option enabled '1'
	# Keep stdout/stderr attached so procd forwards gateway logs to logd,
	# which also makes `logread -e picoclaw` work.
	option logger '1'
	# Seconds to wait before starting when booted less than 120s ago.
	option delay '0'

config gateway 'gateway'
	# SECURITY: loopback only. The gateway serves an HTTP API and the Web UI;
	# binding 0.0.0.0 would expose both (and the agent's tool execution) to the
	# whole LAN and to the WAN if the firewall ever lets it through.
	# Reach it over SSH: ssh -L 18790:127.0.0.1:18790 root@192.168.216.10
	# Only change this to a LAN address if you also add a firewall rule and
	# authentication in front of it.
	option host '127.0.0.1'
	option port '18790'

config agent 'agent'
	# Where the agent reads/writes files and keeps sessions, memory and skills.
	# /etc/picoclaw/workspace lives in the overlay. Point this at an external
	# disk (e.g. /mnt/data/picoclaw/workspace) if the overlay is small or you
	# want chat history to survive a reflash.
	option workspace '/etc/picoclaw/workspace'
	# SECURITY: restrict file tools to the workspace above. The upstream
	# default is already true; this is set explicitly so a future UCI default
	# change cannot silently widen it.
	option restrict_to_workspace '1'

config heartbeat 'heartbeat'
	# Disabled by default: heartbeat makes the agent wake up and call the LLM
	# on an interval, which costs tokens around the clock. Enable it only if
	# you actually want scheduled self-directed runs.
	option enabled '0'
	option interval '30'
